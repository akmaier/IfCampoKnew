name: Weekly Campo scrape

# Mondays 03:00 UTC = 04:00 CET / 05:00 CEST.
# Off-peak for Campo; gives the workweek a fresh corpus by Monday morning.
# Manual run via the Actions tab is also supported.
#
# Architecture (refactored 2026-05-20): 4-job pipeline.
#
#   vars                      — resolves inputs once, ~1 min
#     ├── scrape_current      — walk+fetch+sweep+walker for the current
#     │                         period (589 by default), uploads tmp/*.json
#     │                         as artifacts. 6 h budget.
#     ├── scrape_prior        — same chain for the prior period (565 by
#     │                         default). Has its own monthly cache; on
#     │                         hit, skips the heavy walks. 6 h budget.
#     ├── faudir              — pulls the FAUdir Professor:innen-Index,
#     │                         uploads tmp/faudir-persons.json + the
#     │                         data/personen/ chunk files. ~5 min.
#     └── render_and_release  — needs all three. Downloads their
#                               artifacts, renders markdown, runs all
#                               analyses, commits + zips + Releases.
#                               ~15 min.
#
# Why split? The previous monolith ran sequentially in one job and
# routinely brushed (and twice exceeded) GitHub Actions' job timeout.
# Splitting lets scrape_current / scrape_prior / faudir run in PARALLEL
# (max wall-clock ≈ 3.5 h instead of 8 h), each gets its own 6 h
# budget, and a hiccup in one scrape job doesn't lose the other two.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      period_id:
        description: "Campo periodId (default 589 = SoSe 2026)"
        required: false
        default: "589"
      prior_period_id:
        description: "Optional adjacent period (default 565 = WiSe 2025/26). The Pflicht-Analyse uses both terms for full-year coverage. Empty = skip."
        required: false
        default: "565"
      max_depth:
        description: "Tree-walk max depth (6 = courses inside Studiengänge; 4 = only PO stubs + buckets; 0 = unlimited, hard cap 12)"
        required: false
        default: "6"
      with_courses:
        description: "Also fetch course-detail pages (true/false)"
        required: false
        default: "true"

permissions:
  contents: write  # for committing data/ + creating Releases

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false  # never interrupt an in-flight scrape

jobs:

  # ─── Job 1: resolve workflow inputs once, expose them to other jobs ───
  vars:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      period_id:        ${{ steps.set.outputs.period_id }}
      prior_period_id:  ${{ steps.set.outputs.prior_period_id }}
      max_depth:        ${{ steps.set.outputs.max_depth }}
      with_courses:     ${{ steps.set.outputs.with_courses }}
      iso_week:         ${{ steps.set.outputs.iso_week }}
      iso_month:        ${{ steps.set.outputs.iso_month }}
    steps:
      - name: Resolve inputs
        id: set
        run: |
          echo "period_id=${{ github.event.inputs.period_id || '589' }}" >> "$GITHUB_OUTPUT"
          echo "prior_period_id=${{ github.event.inputs.prior_period_id || '565' }}" >> "$GITHUB_OUTPUT"
          echo "max_depth=${{ github.event.inputs.max_depth || '6' }}"   >> "$GITHUB_OUTPUT"
          echo "with_courses=${{ github.event.inputs.with_courses || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "iso_week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "iso_month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

  # ─── Job 2: scrape the current period (no cache; always re-fetch) ────
  scrape_current:
    needs: vars
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~6 h. **GitHub-hosted runners have a hard
                            # 6 h per-job cap** that overrides any larger
                            # `timeout-minutes` (run 26222834010 ran into
                            # this — 720 was silently treated as 360).
                            # Use a step-level `timeout-minutes` on the
                            # slow search-walker step instead (see below)
                            # and let it fail-soft so the *rest* of the
                            # job (resume-fetch, artifact upload) still
                            # runs inside the per-job budget.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Walk catalogue tree
        run: |
          mkdir -p tmp
          python scraper/scrape.py \
            --period ${{ needs.vars.outputs.period_id }} \
            --out tmp/${{ needs.vars.outputs.period_id }}.json \
            --max-depth ${{ needs.vars.outputs.max_depth }} \
            --interval 0.2 \
            --parallel 4 \
            --checkpoint-every 100 \
            -v

      - name: Fetch course detail pages (catalogue)
        if: needs.vars.outputs.with_courses == 'true'
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.period_id }}.json \
            --out tmp/${{ needs.vars.outputs.period_id }}-courses.json \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Sweep Tagesaktuelle Veranstaltungen for the semester
        if: needs.vars.outputs.with_courses == 'true'
        continue-on-error: true
        run: |
          python scraper/scrape_tagesaktuelle.py \
            --period ${{ needs.vars.outputs.period_id }} \
            --out tmp/${{ needs.vars.outputs.period_id }}-tagesaktuelle.json \
            --interval 0.5 \
            -v

      - name: Fetch additional course details from sweep
        if: needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}-tagesaktuelle.json', needs.vars.outputs.period_id)) != ''
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.period_id }}-tagesaktuelle.json \
            --out tmp/${{ needs.vars.outputs.period_id }}-courses.json \
            --resume \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Search-walker backfill (catches courses missed by catalog walk)
        # Cap at 90 min so a slow-Campo day (run 26222834010 saw search-
        # walker stuck at 3 h+) can't burn the whole 6 h job budget.
        # `search_walker.py` checkpoints to disk every ~50 queries, so
        # whatever was discovered before the cap is still usable by the
        # resume-fetch step below.
        if: needs.vars.outputs.with_courses == 'true'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          python scraper/search_walker.py \
            --period ${{ needs.vars.outputs.period_id }} \
            --queries-file scraper/data/search_queries.txt \
            --out tmp/${{ needs.vars.outputs.period_id }}-search.json \
            --parallel 4 \
            --interval 0.5 \
            -v

      - name: Fetch course details from search backfill
        if: needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}-search.json', needs.vars.outputs.period_id)) != ''
        continue-on-error: true
        timeout-minutes: 45
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.period_id }}-search.json \
            --out tmp/${{ needs.vars.outputs.period_id }}-courses.json \
            --resume \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Upload current-period artifacts
        # `if: always()` so even a partial scrape (walker timed out,
        # resume-fetch never reached) still uploads whatever made it to
        # disk. Without this, a single slow step throws away ~3 h of
        # successful catalog walk + detail fetch + sweep work.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-current-${{ needs.vars.outputs.period_id }}
          path: |
            tmp/${{ needs.vars.outputs.period_id }}.json
            tmp/${{ needs.vars.outputs.period_id }}-courses.json
            tmp/${{ needs.vars.outputs.period_id }}-tagesaktuelle.json
            tmp/${{ needs.vars.outputs.period_id }}-search.json
          if-no-files-found: warn
          retention-days: 7

  # ─── Job 3: scrape the prior period (with monthly cache) ─────────────
  scrape_prior:
    needs: vars
    if: needs.vars.outputs.prior_period_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350   # See scrape_current — GitHub-hosted hard 6 h cap.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Restore prior-period cache (monthly key)
        id: cache_prior
        uses: actions/cache@v4
        with:
          path: |
            tmp/${{ needs.vars.outputs.prior_period_id }}.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-search.json
          # Cache key salted with "v4" — bumped 2026-05-21 when the
          # Organisationseinheit parser was restructured to emit a
          # structured `assigned_programs` list (Entry 0031). Without a
          # bump, the old cached courses.json would lack the new field
          # and the render step's cross-listing fix would have nothing
          # to work with. Bump the salt whenever a parser-level
          # breaking change lands so the cache invalidates cleanly.
          key: campo-prior-${{ needs.vars.outputs.prior_period_id }}-d${{ needs.vars.outputs.max_depth }}-v4-${{ needs.vars.outputs.iso_month }}
          restore-keys: |
            campo-prior-${{ needs.vars.outputs.prior_period_id }}-d${{ needs.vars.outputs.max_depth }}-v4-

      - name: Walk prior period catalogue
        if: steps.cache_prior.outputs.cache-hit != 'true'
        run: |
          mkdir -p tmp
          python scraper/scrape.py \
            --period ${{ needs.vars.outputs.prior_period_id }} \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}.json \
            --max-depth ${{ needs.vars.outputs.max_depth }} \
            --interval 0.2 \
            --parallel 4 \
            --checkpoint-every 100 \
            -v

      - name: Fetch prior-period course details
        if: steps.cache_prior.outputs.cache-hit != 'true' && needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}.json', needs.vars.outputs.prior_period_id)) != ''
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.prior_period_id }}.json \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Sweep Tagesaktuelle for prior period
        if: steps.cache_prior.outputs.cache-hit != 'true' && needs.vars.outputs.with_courses == 'true'
        continue-on-error: true
        run: |
          python scraper/scrape_tagesaktuelle.py \
            --period ${{ needs.vars.outputs.prior_period_id }} \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json \
            --interval 0.5 \
            -v

      - name: Fetch additional prior-period courses from sweep
        if: steps.cache_prior.outputs.cache-hit != 'true' && needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}-tagesaktuelle.json', needs.vars.outputs.prior_period_id)) != ''
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json \
            --resume \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Search-walker backfill for prior period
        # See scrape_current — step-level cap so a slow-Campo day can't
        # eat the per-job budget. Checkpoints to disk every ~50 queries.
        if: needs.vars.outputs.with_courses == 'true'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          python scraper/search_walker.py \
            --period ${{ needs.vars.outputs.prior_period_id }} \
            --queries-file scraper/data/search_queries.txt \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-search.json \
            --parallel 4 \
            --interval 0.5 \
            -v

      - name: Fetch prior-period courses from search backfill
        if: needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}-search.json', needs.vars.outputs.prior_period_id)) != ''
        continue-on-error: true
        timeout-minutes: 45
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.prior_period_id }}-search.json \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json \
            --resume \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Upload prior-period artifacts
        # See scrape_current — `if: always()` so partial scrapes are
        # still persisted as artifacts.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-prior-${{ needs.vars.outputs.prior_period_id }}
          path: |
            tmp/${{ needs.vars.outputs.prior_period_id }}.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-search.json
          if-no-files-found: warn
          retention-days: 7

  # ─── Job 4: FAUdir Professor:innen-Index (runs in parallel) ──────────
  faudir:
    needs: vars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Pull FAUdir Professor:innen-Index
        run: |
          mkdir -p tmp data/personen
          python scraper/faudir_scrape.py \
            --out data/personen/faudir-INDEX.md \
            --interval 0.5 \
            -v

      - name: Upload FAUdir artifacts
        uses: actions/upload-artifact@v4
        with:
          name: faudir
          path: |
            tmp/faudir-persons.json
            data/personen/faudir-*.md
          if-no-files-found: warn
          retention-days: 7

  # ─── Job 5: render markdown + analyse + commit + zip + Release ───────
  render_and_release:
    needs: [vars, scrape_current, scrape_prior, faudir]
    # Continue even if one of the upstream jobs failed (e.g. prior-period
    # scrape hit a transient Campo issue) — the analyse adapts to whichever
    # period artifacts are present.
    if: always() && needs.scrape_current.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Download current-period artifacts
        uses: actions/download-artifact@v4
        with:
          name: scrape-current-${{ needs.vars.outputs.period_id }}
          path: tmp

      - name: Download prior-period artifacts
        if: needs.scrape_prior.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: scrape-prior-${{ needs.vars.outputs.prior_period_id }}
          path: tmp

      - name: Download FAUdir artifacts
        if: needs.faudir.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: faudir
          path: .  # restores tmp/faudir-persons.json AND data/personen/faudir-*.md

      - name: Render markdown corpus
        run: |
          if [ -f "tmp/${{ needs.vars.outputs.period_id }}-courses.json" ]; then
            python scraper/render_markdown.py \
              --in tmp/${{ needs.vars.outputs.period_id }}.json \
              --courses tmp/${{ needs.vars.outputs.period_id }}-courses.json \
              --out data
          else
            python scraper/render_markdown.py \
              --in tmp/${{ needs.vars.outputs.period_id }}.json \
              --out data
          fi

      - name: Render prior-period markdown corpus
        if: needs.vars.outputs.prior_period_id != '' && hashFiles(format('tmp/{0}.json', needs.vars.outputs.prior_period_id)) != ''
        continue-on-error: true
        run: |
          if [ -f "tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json" ]; then
            python scraper/render_markdown.py \
              --in tmp/${{ needs.vars.outputs.prior_period_id }}.json \
              --courses tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json \
              --out data
          else
            python scraper/render_markdown.py \
              --in tmp/${{ needs.vars.outputs.prior_period_id }}.json \
              --out data
          fi

      - name: Aggregate Lehrende-Index aus Campo (people)
        if: hashFiles(format('tmp/{0}-courses.json', needs.vars.outputs.period_id)) != ''
        run: |
          INPUTS="tmp/${{ needs.vars.outputs.period_id }}.json tmp/${{ needs.vars.outputs.period_id }}-courses.json"
          if [ -n "${{ needs.vars.outputs.prior_period_id }}" ]; then
            for f in tmp/${{ needs.vars.outputs.prior_period_id }}.json tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json; do
              [ -f "$f" ] && INPUTS="$INPUTS $f"
            done
          fi
          echo "people_index inputs: $INPUTS"
          python scraper/people_index.py \
            --inputs $INPUTS \
            --out data/personen \
            -v

      - name: Heuristische Pflicht-Analyse + W-Profs-Cross-Ref
        if: hashFiles(format('tmp/{0}-courses.json', needs.vars.outputs.period_id)) != ''
        run: |
          PRIOR_TREE="tmp/${{ needs.vars.outputs.prior_period_id }}.json"
          PRIOR_COURSES="tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json"
          if [ -n "${{ needs.vars.outputs.prior_period_id }}" ] && [ -f "$PRIOR_TREE" ] && [ -f "$PRIOR_COURSES" ]; then
            echo "Running Pflicht-Analyse with both periods (current + prior)"
            python scraper/analyze_pflicht.py \
              --data data \
              --tree "$PRIOR_TREE" tmp/${{ needs.vars.outputs.period_id }}.json \
              --courses "$PRIOR_COURSES" tmp/${{ needs.vars.outputs.period_id }}-courses.json \
              --out data/analyse/pflichtveranstaltungen.md \
              -v
          else
            echo "Prior-period data not present — single-period analyse"
            python scraper/analyze_pflicht.py \
              --data data \
              --tree tmp/${{ needs.vars.outputs.period_id }}.json \
              --courses tmp/${{ needs.vars.outputs.period_id }}-courses.json \
              --out data/analyse/pflichtveranstaltungen.md \
              -v
          fi

      - name: Strukturierte Pflichtmodul-Extraktion aus PO-Anlagen
        run: |
          python scraper/extract_pflicht_module.py \
            --data data \
            --out data/analyse/pflichtmodule.md \
            -v

      - name: Commit corpus changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No corpus changes — skipping commit and release."
          else
            git commit -m "Weekly scrape: ${{ needs.vars.outputs.iso_week }} (period ${{ needs.vars.outputs.period_id }})"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build corpus zip
        if: steps.commit.outputs.changed == 'true'
        id: zip
        run: |
          cd data
          ZIP_NAME="ifcampoknew-corpus-${{ needs.vars.outputs.iso_week }}.zip"
          zip -r -q "../$ZIP_NAME" .
          cd ..
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$ZIP_NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cut a Release with the corpus zip + JSON intermediates
        if: steps.commit.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ needs.vars.outputs.iso_week }}
          name: Snapshot ${{ needs.vars.outputs.iso_week }} (period ${{ needs.vars.outputs.period_id }})
          body: |
            Automated weekly scrape of Campo.

            * periodId: ${{ needs.vars.outputs.period_id }}
            * tree max-depth: ${{ needs.vars.outputs.max_depth }}
            * with course details: ${{ needs.vars.outputs.with_courses }}
            * corpus zip: ${{ steps.zip.outputs.name }} (${{ steps.zip.outputs.size }})

            Download `${{ steps.zip.outputs.name }}` for a self-contained,
            RAG-ready markdown corpus. Start with `README.md` inside the zip.
          files: |
            ${{ steps.zip.outputs.name }}
            tmp/${{ needs.vars.outputs.period_id }}.json
            tmp/${{ needs.vars.outputs.period_id }}-courses.json
            tmp/${{ needs.vars.outputs.prior_period_id }}.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json
          fail_on_unmatched_files: false
