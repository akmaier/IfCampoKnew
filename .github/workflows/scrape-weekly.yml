name: Weekly Campo scrape

# Mondays 03:00 UTC = 04:00 CET / 05:00 CEST.
# Off-peak for Campo; gives the workweek a fresh corpus by Monday morning.
# Manual run via the Actions tab is also supported.
#
# Architecture (refactored 2026-05-24 for depth-9): sharded pipeline.
#
#   vars                       — resolves inputs once, ~5 s
#     ├── seed_shards_current  — depth-3 walk + shard-split, ~3 min
#     │       ↓
#     │   walk_shards_current  — MATRIX of N shard-walkers (in parallel)
#     │   [shard 0…N-1]          each walks its shard to depth-9, ~30-60 min
#     │       ↓
#     │   assemble_current     — merge → fetch → sweep → walker → upload
#     │
#     ├── cache_prior_check    — lookup-only cache probe (~2 s)
#     ├── seed_shards_prior    — same shape as current (skipped on cache hit)
#     ├── walk_shards_prior    — same shape as current (skipped on cache hit)
#     ├── assemble_prior       — same shape; also cache-save
#     │
#     ├── faudir               — FAUdir Professor:innen-Index, ~5 min
#     │
#     └── render_and_release   — needs the two assemble_ jobs + faudir.
#                                Renders markdown, runs analyses, commits +
#                                zips + Releases.
#
# Why sharded? A single depth-9 walk of one period does not fit in
# GitHub Actions' HARD 6 h per-job cap (see Entry 0032). Splitting the
# depth-3 program frontier into N shards lets us walk each program
# subtree in its own job in parallel, then merge back. Wall-clock =
# time-of-slowest-shard + ~4 h assemble, comfortably inside the cap.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      period_id:
        description: "Campo periodId (default 589 = SoSe 2026)"
        required: false
        default: "589"
      prior_period_id:
        description: "Optional adjacent period (default 565 = WiSe 2025/26). The Pflicht-Analyse uses both terms for full-year coverage. Empty = skip."
        required: false
        default: "565"
      max_depth:
        description: "Tree-walk max depth (9 = drills into every Wahlpflicht subtree; 6 = courses inside Studiengänge; 4 = only PO stubs; 0 = unlimited, hard cap 12)"
        required: false
        default: "9"
      shard_count:
        description: "Number of parallel walk shards per period (default 8; used only for depth ≥ 5)"
        required: false
        default: "8"
      with_courses:
        description: "Also fetch course-detail pages (true/false)"
        required: false
        default: "true"

permissions:
  contents: write  # for committing data/ + creating Releases

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false  # never interrupt an in-flight scrape

jobs:

  # ─── Job 1: resolve workflow inputs once, expose them to other jobs ───
  vars:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      period_id:        ${{ steps.set.outputs.period_id }}
      prior_period_id:  ${{ steps.set.outputs.prior_period_id }}
      max_depth:        ${{ steps.set.outputs.max_depth }}
      shard_count:      ${{ steps.set.outputs.shard_count }}
      with_courses:     ${{ steps.set.outputs.with_courses }}
      iso_week:         ${{ steps.set.outputs.iso_week }}
      iso_month:        ${{ steps.set.outputs.iso_month }}
    steps:
      - name: Resolve inputs
        id: set
        run: |
          echo "period_id=${{ github.event.inputs.period_id || '589' }}" >> "$GITHUB_OUTPUT"
          echo "prior_period_id=${{ github.event.inputs.prior_period_id || '565' }}" >> "$GITHUB_OUTPUT"
          echo "max_depth=${{ github.event.inputs.max_depth || '9' }}"   >> "$GITHUB_OUTPUT"
          echo "shard_count=${{ github.event.inputs.shard_count || '8' }}" >> "$GITHUB_OUTPUT"
          echo "with_courses=${{ github.event.inputs.with_courses || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "iso_week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "iso_month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

  # ─── Current period: seed shards (depth-3 walk + shard split) ────────
  seed_shards_current:
    needs: vars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shard_indices: ${{ steps.emit.outputs.shard_indices }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Shallow walk (depth-3) to enumerate program frontier
        run: |
          mkdir -p tmp
          python scraper/scrape.py \
            --period ${{ needs.vars.outputs.period_id }} \
            --out tmp/${{ needs.vars.outputs.period_id }}-shallow.json \
            --max-depth 3 \
            --parallel 4 \
            --interval 0.2 \
            -v

      - name: Split into ${{ needs.vars.outputs.shard_count }} shard checkpoints
        run: |
          python scraper/shard_walk.py \
            --in tmp/${{ needs.vars.outputs.period_id }}-shallow.json \
            --shards ${{ needs.vars.outputs.shard_count }} \
            --max-depth ${{ needs.vars.outputs.max_depth }} \
            --out-dir tmp/shards \
            -v
          ls -la tmp/shards

      - name: Emit shard-indices matrix output
        id: emit
        run: |
          COUNT=$(ls tmp/shards/${{ needs.vars.outputs.period_id }}-shallow-shard-*.json.checkpoint.json | wc -l | tr -d ' ')
          INDICES=$(python -c "import json; print(json.dumps(list(range($COUNT))))")
          echo "shard_indices=$INDICES" >> "$GITHUB_OUTPUT"
          echo "will spawn $COUNT walk_shard jobs: $INDICES"

      - name: Upload shard checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: shards-current-${{ needs.vars.outputs.period_id }}
          path: tmp/shards/*
          if-no-files-found: error
          retention-days: 1

  # ─── Current period: matrix walker (one job per shard, in parallel) ──
  walk_shards_current:
    needs: [vars, seed_shards_current]
    runs-on: ubuntu-latest
    timeout-minutes: 350  # per-shard 6h cap (GitHub-hosted hard limit)
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.seed_shards_current.outputs.shard_indices) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Download shard checkpoints
        uses: actions/download-artifact@v4
        with:
          name: shards-current-${{ needs.vars.outputs.period_id }}
          path: tmp/shards

      - name: Prime resume checkpoint for shard ${{ matrix.shard }}
        # shard_walk.py names files after the *shallow* stem; the walker
        # picks up its checkpoint by looking for <out>.checkpoint.json next
        # to --out. So we copy the shard's checkpoint to that location.
        run: |
          mkdir -p tmp
          cp tmp/shards/${{ needs.vars.outputs.period_id }}-shallow-shard-${{ matrix.shard }}.json.checkpoint.json \
             tmp/${{ needs.vars.outputs.period_id }}-shard-${{ matrix.shard }}.json.checkpoint.json

      - name: Walk shard ${{ matrix.shard }} to depth ${{ needs.vars.outputs.max_depth }}
        run: |
          python scraper/scrape.py \
            --period ${{ needs.vars.outputs.period_id }} \
            --out tmp/${{ needs.vars.outputs.period_id }}-shard-${{ matrix.shard }}.json \
            --max-depth ${{ needs.vars.outputs.max_depth }} \
            --resume \
            --parallel 4 \
            --interval 0.2 \
            --checkpoint-every 100 \
            -v

      - name: Upload shard-${{ matrix.shard }} subtree
        # `if: always()` so a partial walk (step timeout) still uploads
        # whatever was written to disk via checkpoint-every.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-shard-current-${{ needs.vars.outputs.period_id }}-${{ matrix.shard }}
          path: tmp/${{ needs.vars.outputs.period_id }}-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1

  # ─── Current period: merge + fetch + sweep + walker + upload ─────────
  assemble_current:
    needs: [vars, walk_shards_current]
    if: always() && needs.walk_shards_current.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Download all walk-shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: walk-shard-current-${{ needs.vars.outputs.period_id }}-*
          path: tmp/shards-out
          merge-multiple: true

      - name: Merge shard subtrees into one snapshot
        run: |
          mkdir -p tmp
          # Fold empty-artifact edge case (all shards timed out) into a helpful error.
          shopt -s nullglob
          FILES=(tmp/shards-out/${{ needs.vars.outputs.period_id }}-shard-*.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no walk-shard artifacts materialised; cannot merge"
            exit 1
          fi
          python scraper/merge_shards.py \
            --in "${FILES[@]}" \
            --out tmp/${{ needs.vars.outputs.period_id }}.json \
            -v

      - name: Fetch course detail pages (catalogue)
        if: needs.vars.outputs.with_courses == 'true'
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.period_id }}.json \
            --out tmp/${{ needs.vars.outputs.period_id }}-courses.json \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Sweep Tagesaktuelle Veranstaltungen for the semester
        if: needs.vars.outputs.with_courses == 'true'
        continue-on-error: true
        run: |
          python scraper/scrape_tagesaktuelle.py \
            --period ${{ needs.vars.outputs.period_id }} \
            --out tmp/${{ needs.vars.outputs.period_id }}-tagesaktuelle.json \
            --interval 0.5 \
            -v

      - name: Fetch additional course details from sweep
        if: needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}-tagesaktuelle.json', needs.vars.outputs.period_id)) != ''
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.period_id }}-tagesaktuelle.json \
            --out tmp/${{ needs.vars.outputs.period_id }}-courses.json \
            --resume \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Search-walker backfill (catches courses missed by catalog walk)
        # Belt-and-suspenders. At depth-9 most previously-orphaned
        # courses (like Person A's LLM seminar) are now
        # catalog-reachable, but the search-walker still catches deep
        # topic-keyword hits ("Generative AI", etc). Capped at 60 min
        # since its role has shrunk.
        if: needs.vars.outputs.with_courses == 'true'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          python scraper/search_walker.py \
            --period ${{ needs.vars.outputs.period_id }} \
            --queries-file scraper/data/search_queries.txt \
            --out tmp/${{ needs.vars.outputs.period_id }}-search.json \
            --parallel 4 \
            --interval 0.5 \
            -v

      - name: Fetch course details from search backfill
        if: needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}-search.json', needs.vars.outputs.period_id)) != ''
        continue-on-error: true
        timeout-minutes: 75
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.period_id }}-search.json \
            --out tmp/${{ needs.vars.outputs.period_id }}-courses.json \
            --resume \
            --parallel 4 \
            --interval 0.3 \
            --save-every 50 \
            -v

      - name: Upload current-period artifacts
        # `if: always()` so a partial pipeline still uploads what made it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-current-${{ needs.vars.outputs.period_id }}
          path: |
            tmp/${{ needs.vars.outputs.period_id }}.json
            tmp/${{ needs.vars.outputs.period_id }}-courses.json
            tmp/${{ needs.vars.outputs.period_id }}-tagesaktuelle.json
            tmp/${{ needs.vars.outputs.period_id }}-search.json
          if-no-files-found: warn
          retention-days: 7

  # ─── Prior period: cache probe (fast; used to short-circuit shards) ──
  cache_prior_check:
    needs: vars
    if: needs.vars.outputs.prior_period_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      cache_hit: ${{ steps.restore.outputs.cache-hit }}
    steps:
      - name: Restore prior cache (lookup only)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/${{ needs.vars.outputs.prior_period_id }}.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-search.json
          # Cache key v5 — bumped when the walk output changed shape
          # (sharded → merged snapshot). Whenever a parser-level breaking
          # change lands, bump the salt so the cache invalidates cleanly.
          key: campo-prior-${{ needs.vars.outputs.prior_period_id }}-d${{ needs.vars.outputs.max_depth }}-v5-${{ needs.vars.outputs.iso_month }}
          lookup-only: true

  # ─── Prior period: seed shards (skipped on cache hit) ────────────────
  seed_shards_prior:
    needs: [vars, cache_prior_check]
    if: needs.vars.outputs.prior_period_id != '' && needs.cache_prior_check.outputs.cache_hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shard_indices: ${{ steps.emit.outputs.shard_indices }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Shallow walk (depth-3) — prior period
        run: |
          mkdir -p tmp
          python scraper/scrape.py \
            --period ${{ needs.vars.outputs.prior_period_id }} \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-shallow.json \
            --max-depth 3 \
            --parallel 4 \
            --interval 0.2 \
            -v

      - name: Split into ${{ needs.vars.outputs.shard_count }} shard checkpoints
        run: |
          python scraper/shard_walk.py \
            --in tmp/${{ needs.vars.outputs.prior_period_id }}-shallow.json \
            --shards ${{ needs.vars.outputs.shard_count }} \
            --max-depth ${{ needs.vars.outputs.max_depth }} \
            --out-dir tmp/shards \
            -v

      - name: Emit shard-indices matrix output
        id: emit
        run: |
          COUNT=$(ls tmp/shards/${{ needs.vars.outputs.prior_period_id }}-shallow-shard-*.json.checkpoint.json | wc -l | tr -d ' ')
          INDICES=$(python -c "import json; print(json.dumps(list(range($COUNT))))")
          echo "shard_indices=$INDICES" >> "$GITHUB_OUTPUT"

      - name: Upload shard checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: shards-prior-${{ needs.vars.outputs.prior_period_id }}
          path: tmp/shards/*
          if-no-files-found: error
          retention-days: 1

  # ─── Prior period: matrix walker ─────────────────────────────────────
  walk_shards_prior:
    needs: [vars, cache_prior_check, seed_shards_prior]
    if: needs.vars.outputs.prior_period_id != '' && needs.cache_prior_check.outputs.cache_hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.seed_shards_prior.outputs.shard_indices) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Download shard checkpoints
        uses: actions/download-artifact@v4
        with:
          name: shards-prior-${{ needs.vars.outputs.prior_period_id }}
          path: tmp/shards

      - name: Prime resume checkpoint for shard ${{ matrix.shard }}
        run: |
          mkdir -p tmp
          cp tmp/shards/${{ needs.vars.outputs.prior_period_id }}-shallow-shard-${{ matrix.shard }}.json.checkpoint.json \
             tmp/${{ needs.vars.outputs.prior_period_id }}-shard-${{ matrix.shard }}.json.checkpoint.json

      - name: Walk shard ${{ matrix.shard }} to depth ${{ needs.vars.outputs.max_depth }}
        run: |
          python scraper/scrape.py \
            --period ${{ needs.vars.outputs.prior_period_id }} \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-shard-${{ matrix.shard }}.json \
            --max-depth ${{ needs.vars.outputs.max_depth }} \
            --resume \
            --parallel 4 \
            --interval 0.2 \
            --checkpoint-every 100 \
            -v

      - name: Upload shard-${{ matrix.shard }} subtree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-shard-prior-${{ needs.vars.outputs.prior_period_id }}-${{ matrix.shard }}
          path: tmp/${{ needs.vars.outputs.prior_period_id }}-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1

  # ─── Prior period: assemble (also handles cache-hit + cache-save) ────
  assemble_prior:
    needs: [vars, cache_prior_check, walk_shards_prior]
    # Run on cache hit (skip work, just upload) OR on successful shard walk.
    if: >-
      needs.vars.outputs.prior_period_id != '' &&
      always() &&
      (needs.cache_prior_check.outputs.cache_hit == 'true'
       || needs.walk_shards_prior.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Restore prior cache (real)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            tmp/${{ needs.vars.outputs.prior_period_id }}.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-search.json
          key: campo-prior-${{ needs.vars.outputs.prior_period_id }}-d${{ needs.vars.outputs.max_depth }}-v5-${{ needs.vars.outputs.iso_month }}
          restore-keys: |
            campo-prior-${{ needs.vars.outputs.prior_period_id }}-d${{ needs.vars.outputs.max_depth }}-v5-

      - name: Download prior walk-shard artifacts (on cache miss)
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: walk-shard-prior-${{ needs.vars.outputs.prior_period_id }}-*
          path: tmp/shards-out
          merge-multiple: true

      - name: Merge prior shard subtrees (on cache miss)
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          mkdir -p tmp
          shopt -s nullglob
          FILES=(tmp/shards-out/${{ needs.vars.outputs.prior_period_id }}-shard-*.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no prior walk-shard artifacts materialised"
            exit 1
          fi
          python scraper/merge_shards.py \
            --in "${FILES[@]}" \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}.json \
            -v

      - name: Fetch prior-period course details (on cache miss)
        if: steps.restore.outputs.cache-hit != 'true' && needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}.json', needs.vars.outputs.prior_period_id)) != ''
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.prior_period_id }}.json \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Sweep Tagesaktuelle for prior period (on cache miss)
        if: steps.restore.outputs.cache-hit != 'true' && needs.vars.outputs.with_courses == 'true'
        continue-on-error: true
        run: |
          python scraper/scrape_tagesaktuelle.py \
            --period ${{ needs.vars.outputs.prior_period_id }} \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json \
            --interval 0.5 \
            -v

      - name: Fetch additional prior-period courses from sweep (on cache miss)
        if: steps.restore.outputs.cache-hit != 'true' && needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}-tagesaktuelle.json', needs.vars.outputs.prior_period_id)) != ''
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json \
            --resume \
            --parallel 2 \
            --interval 0.2 \
            --save-every 50 \
            -v

      - name: Search-walker backfill for prior period (on cache miss)
        if: steps.restore.outputs.cache-hit != 'true' && needs.vars.outputs.with_courses == 'true'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          python scraper/search_walker.py \
            --period ${{ needs.vars.outputs.prior_period_id }} \
            --queries-file scraper/data/search_queries.txt \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-search.json \
            --parallel 4 \
            --interval 0.5 \
            -v

      - name: Fetch prior-period courses from search backfill (on cache miss)
        if: steps.restore.outputs.cache-hit != 'true' && needs.vars.outputs.with_courses == 'true' && hashFiles(format('tmp/{0}-search.json', needs.vars.outputs.prior_period_id)) != ''
        continue-on-error: true
        timeout-minutes: 75
        run: |
          python scraper/fetch_courses.py \
            --in tmp/${{ needs.vars.outputs.prior_period_id }}-search.json \
            --out tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json \
            --resume \
            --parallel 4 \
            --interval 0.3 \
            --save-every 50 \
            -v

      - name: Save prior cache (on cache miss)
        if: steps.restore.outputs.cache-hit != 'true' && hashFiles(format('tmp/{0}.json', needs.vars.outputs.prior_period_id)) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            tmp/${{ needs.vars.outputs.prior_period_id }}.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-search.json
          key: campo-prior-${{ needs.vars.outputs.prior_period_id }}-d${{ needs.vars.outputs.max_depth }}-v5-${{ needs.vars.outputs.iso_month }}

      - name: Upload prior-period artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-prior-${{ needs.vars.outputs.prior_period_id }}
          path: |
            tmp/${{ needs.vars.outputs.prior_period_id }}.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-tagesaktuelle.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-search.json
          if-no-files-found: warn
          retention-days: 7

  # ─── FAUdir Professor:innen-Index (runs in parallel) ─────────────────
  faudir:
    needs: vars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Pull FAUdir Professor:innen-Index
        run: |
          mkdir -p tmp data/personen
          python scraper/faudir_scrape.py \
            --out data/personen/faudir-INDEX.md \
            --interval 0.5 \
            -v

      - name: Upload FAUdir artifacts
        uses: actions/upload-artifact@v4
        with:
          name: faudir
          path: |
            tmp/faudir-persons.json
            data/personen/faudir-*.md
          if-no-files-found: warn
          retention-days: 7

  # ─── Render markdown + analyse + commit + zip + Release ──────────────
  render_and_release:
    needs: [vars, assemble_current, assemble_prior, faudir]
    if: always() && needs.assemble_current.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Download current-period artifacts
        uses: actions/download-artifact@v4
        with:
          name: scrape-current-${{ needs.vars.outputs.period_id }}
          path: tmp

      - name: Download prior-period artifacts
        if: needs.assemble_prior.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: scrape-prior-${{ needs.vars.outputs.prior_period_id }}
          path: tmp

      - name: Download FAUdir artifacts
        if: needs.faudir.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: faudir
          path: .  # restores tmp/faudir-persons.json AND data/personen/faudir-*.md

      - name: Render markdown corpus
        run: |
          if [ -f "tmp/${{ needs.vars.outputs.period_id }}-courses.json" ]; then
            python scraper/render_markdown.py \
              --in tmp/${{ needs.vars.outputs.period_id }}.json \
              --courses tmp/${{ needs.vars.outputs.period_id }}-courses.json \
              --out data
          else
            python scraper/render_markdown.py \
              --in tmp/${{ needs.vars.outputs.period_id }}.json \
              --out data
          fi

      - name: Render prior-period markdown corpus
        if: needs.vars.outputs.prior_period_id != '' && hashFiles(format('tmp/{0}.json', needs.vars.outputs.prior_period_id)) != ''
        continue-on-error: true
        run: |
          if [ -f "tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json" ]; then
            python scraper/render_markdown.py \
              --in tmp/${{ needs.vars.outputs.prior_period_id }}.json \
              --courses tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json \
              --out data
          else
            python scraper/render_markdown.py \
              --in tmp/${{ needs.vars.outputs.prior_period_id }}.json \
              --out data
          fi

      - name: Aggregate Lehrende-Index aus Campo (people)
        if: hashFiles(format('tmp/{0}-courses.json', needs.vars.outputs.period_id)) != ''
        run: |
          INPUTS="tmp/${{ needs.vars.outputs.period_id }}.json tmp/${{ needs.vars.outputs.period_id }}-courses.json"
          if [ -n "${{ needs.vars.outputs.prior_period_id }}" ]; then
            for f in tmp/${{ needs.vars.outputs.prior_period_id }}.json tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json; do
              [ -f "$f" ] && INPUTS="$INPUTS $f"
            done
          fi
          echo "people_index inputs: $INPUTS"
          python scraper/people_index.py \
            --inputs $INPUTS \
            --out data/personen \
            -v

      - name: Heuristische Pflicht-Analyse + W-Profs-Cross-Ref
        if: hashFiles(format('tmp/{0}-courses.json', needs.vars.outputs.period_id)) != ''
        run: |
          PRIOR_TREE="tmp/${{ needs.vars.outputs.prior_period_id }}.json"
          PRIOR_COURSES="tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json"
          if [ -n "${{ needs.vars.outputs.prior_period_id }}" ] && [ -f "$PRIOR_TREE" ] && [ -f "$PRIOR_COURSES" ]; then
            echo "Running Pflicht-Analyse with both periods (current + prior)"
            python scraper/analyze_pflicht.py \
              --data data \
              --tree "$PRIOR_TREE" tmp/${{ needs.vars.outputs.period_id }}.json \
              --courses "$PRIOR_COURSES" tmp/${{ needs.vars.outputs.period_id }}-courses.json \
              --out data/analyse/pflichtveranstaltungen.md \
              -v
          else
            echo "Prior-period data not present — single-period analyse"
            python scraper/analyze_pflicht.py \
              --data data \
              --tree tmp/${{ needs.vars.outputs.period_id }}.json \
              --courses tmp/${{ needs.vars.outputs.period_id }}-courses.json \
              --out data/analyse/pflichtveranstaltungen.md \
              -v
          fi

      - name: Strukturierte Pflichtmodul-Extraktion aus PO-Anlagen
        run: |
          python scraper/extract_pflicht_module.py \
            --data data \
            --out data/analyse/pflichtmodule.md \
            -v

      - name: Commit corpus changes
        # Retry loop for the race window: some other push may land on
        # main while our multi-hour scrape runs. We only ever touch
        # data/, so a `pull --rebase` is conflict-free in practice.
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No corpus changes — skipping commit and release."
            exit 0
          fi
          git commit -m "Weekly scrape: ${{ needs.vars.outputs.iso_week }} (period ${{ needs.vars.outputs.period_id }})"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then
              echo "push succeeded on attempt $attempt"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $attempt rejected — refetching and retrying"
            sleep $((attempt * 5))
          done
          echo "ERROR: push failed after 5 attempts"
          exit 1

      - name: Build corpus zip
        if: steps.commit.outputs.changed == 'true'
        id: zip
        run: |
          cd data
          ZIP_NAME="ifcampoknew-corpus-${{ needs.vars.outputs.iso_week }}.zip"
          zip -r -q "../$ZIP_NAME" .
          cd ..
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$ZIP_NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cut a Release with the corpus zip + JSON intermediates
        if: steps.commit.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ needs.vars.outputs.iso_week }}
          name: Snapshot ${{ needs.vars.outputs.iso_week }} (period ${{ needs.vars.outputs.period_id }})
          body: |
            Automated weekly scrape of Campo.

            * periodId: ${{ needs.vars.outputs.period_id }}
            * tree max-depth: ${{ needs.vars.outputs.max_depth }}
            * shard count: ${{ needs.vars.outputs.shard_count }}
            * with course details: ${{ needs.vars.outputs.with_courses }}
            * corpus zip: ${{ steps.zip.outputs.name }} (${{ steps.zip.outputs.size }})

            Download `${{ steps.zip.outputs.name }}` for a self-contained,
            RAG-ready markdown corpus. Start with `README.md` inside the zip.
          files: |
            ${{ steps.zip.outputs.name }}
            tmp/${{ needs.vars.outputs.period_id }}.json
            tmp/${{ needs.vars.outputs.period_id }}-courses.json
            tmp/${{ needs.vars.outputs.prior_period_id }}.json
            tmp/${{ needs.vars.outputs.prior_period_id }}-courses.json
          fail_on_unmatched_files: false
